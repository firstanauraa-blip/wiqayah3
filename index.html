<style>
:root{
  /* layout: satu kolom selebar HP; HUD perisai di atas, linimasa sebagai arena */
  --paper:#eef2ec; --surface:#ffffff; --ink:#12302a; --muted:#56675f; --line:#d5ded6;
  --leaf:#1d7558; --leaf-soft:#dcefe5; --accent:#d9971c; --accent-soft:#fbefd4;
  --danger:#b8432a; --danger-soft:#f8e1da;
  --display:"Unbounded",system-ui,sans-serif; --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --arab:"Amiri","Traditional Arabic",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1714; --surface:#15231e; --ink:#e6eee9; --muted:#9db0a7; --line:#28392f;
  --leaf:#4cc093; --leaf-soft:#173a2d; --accent:#f0b73e; --accent-soft:#3a2e12;
  --danger:#e47a5f; --danger-soft:#3d1f17; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0d1714; --surface:#15231e; --ink:#e6eee9; --muted:#9db0a7; --line:#28392f;
  --leaf:#4cc093; --leaf-soft:#173a2d; --accent:#f0b73e; --accent-soft:#3a2e12;
  --danger:#e47a5f; --danger-soft:#3d1f17; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:540px;margin:0 auto;padding:12px 16px 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:30px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{font:600 15px var(--body);border-radius:12px;padding:13px 18px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,.tk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;font:500 15px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;line-height:1.45}
.opt:hover{border-color:var(--leaf)}
.opt.good,.tk.good{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.bad,.tk.bad{border-color:var(--danger);background:var(--danger-soft)}
.opt[disabled],.tk[disabled]{cursor:default}
.tag{display:inline-block;font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.tag.gold{background:var(--accent-soft);color:var(--accent)}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.arab{font-family:var(--arab);font-size:54px;line-height:1;color:var(--leaf)}
.wordmark{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.18em;color:var(--muted)}
.hud{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0 10px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.hud .lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);transition:width .4s ease}
.bar.low i{background:var(--danger)}
.score{font:700 20px var(--display);font-variant-numeric:tabular-nums;text-align:right}
.combo{grid-column:1/-1;font-size:12px;color:var(--accent);font-weight:700;min-height:16px}
.timer{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.post{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.post-head{display:flex;gap:10px;align-items:center;padding:12px 14px}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--display);flex:none;color:#fff}
.post-body{padding:0 14px 14px}
.post-media{margin:0 14px 12px;border-radius:12px;padding:16px;font-weight:600;font-size:14px;line-height:1.4}
.post-meta{display:flex;gap:16px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tk{font:600 14px var(--body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 6px;cursor:pointer;line-height:1.2}
.tk b{display:block;font:700 18px var(--display)}
.tk small{font-size:11px;color:var(--muted)}
.tk.safe{border-style:dashed}
.reveal{border-left:4px solid var(--leaf);background:var(--surface);border-radius:0 14px 14px 0;padding:14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.reveal.bad{border-left-color:var(--danger)}
.dalil{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--leaf-soft);font-size:14px}
.dalil b{color:var(--leaf)}
.bubble{background:var(--leaf-soft);border-radius:4px 16px 16px 16px;padding:12px 14px}
.bubble .from{font-size:12px;color:var(--leaf);font-weight:700;margin-bottom:4px}
.vax{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.vax b.l{font:700 22px var(--display);color:var(--accent);text-align:center;background:var(--accent-soft);border-radius:10px;padding:6px 0}
.big{font:700 44px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.footer{margin-top:24px;font-size:12px;color:var(--muted);line-height:1.5}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.rise{animation:rise .35s ease}
@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.shake,.rise{animation:none}.bar i{transition:none}}
</style>
</head>

function stopT(){if(tick){clearInterval(tick);tick=null;}}

  <span class="tag gold">Vaksin · dosis lemah</span>
  <h2>Lima trik SEBAR</h2>
  <p class="small muted">Seperti vaksin, kamu dikenalkan dulu pada versi lemah triknya lewat contoh yang tidak sensitif. Setelah itu, kamu akan menghadapinya di linimasa sungguhan.</p>
  <div class="card">${VAX.map(v=>`<div class="vax"><b class="l">${v.k}</b><div><b>${TECH[v.k]}</b><div class="small">${v.d}</div><div class="small muted">${v.ex}</div></div></div>`).join("")}</div>
  <button class="btn" onclick="set({screen:'feed',fi:0,fpick:null})">Mulai patroli</button>
 </div>`);
}
function feed(){
 const P=FEED[S.fi]; const pk=S.fpick;
 const keys=["S","E","B","A","R","OK"];
 const btns=keys.map(k=>{let cls="tk"+(k==="OK"?" safe":""); if(pk!==null){ if(k===P.a) cls+=" good"; else if(k===pk) cls+=" bad";}
   return `<button class="${cls}" ${pk!==null?"disabled":""} onclick="pickFeed('${k}')"><b>${k==="OK"?"✓":k}</b><small>${TECH[k]}</small></button>`;}).join("");
 let rv="";
 if(pk!==null){const ok=pk===P.a;
  rv=`<div class="reveal ${ok?"":"bad"} rise stack">
   <div class="row"><span class="tag ${ok?"":"red"}">${pk==="timeout"?"Waktu habis":ok?"Tepat":"Tertipu"}</span><span class="tag gold">${TECH[P.a]}</span></div>
   <p>${P.why}</p><div class="dalil">${DALIL[P.a]}</div>
   <button class="btn" onclick="nextFeed()">${S.fi<FEED.length-1?"Unggahan berikutnya":"Lanjut ke Babak 2"}</button></div>`;}
 $(`${hud("Patroli "+(S.fi+1)+"/"+FEED.length)}
 <div class="stack ${S.fx}">
  ${pk===null?`<div class="timer"><i id="tbar"></i></div>`:""}
  <article class="post">
   <div class="post-head"><div class="ava" style="background:${P.c}">${P.u.slice(0,2).toUpperCase()}</div><div><b>@${P.u}</b><div class="small muted">Disarankan untukmu</div></div></div>
   ${P.media?`<div class="post-media" style="background:var(--accent-soft);color:var(--ink)">${P.media}</div>`:""}
   <div class="post-body">${P.txt}</div>
   <div class="post-meta"><span>${P.likes}</span><span>Bagikan</span><span>Komentar</span></div>
  </article>
  <p class="small"><b>Trik apa yang dipakai unggahan ini?</b> Pilih ✓ Aman jika tidak ada trik manipulasi.</p>
  <div class="tks">${btns}</div>
  ${rv}
 </div>`);
 if(pk===null){let left=TIME; const bar=document.getElementById("tbar");
  tick=setInterval(()=>{left-=0.25; if(bar) bar.style.width=(left/TIME*100)+"%"; if(left<=0){stopT();pickFeed("timeout");}},250);}
}
function pickFeed(k){
 const P=FEED[S.fi]; const ok=k===P.a; const st={...S.stats}; st[P.a]=st[P.a]||{n:0,ok:0}; st[P.a].n++; if(ok) st[P.a].ok++;
 S.stats=st; S.fpick=k;
 if(ok){S.combo++; S.best=Math.max(S.best,S.combo); S.score+=100+(S.combo-1)*20;} else hurt(12);
 render();
}
function nextFeed(){ if(S.shield<=0) return set({screen:"over"}); if(S.fi<FEED.length-1) set({fi:S.fi+1,fpick:null}); else set({screen:"tabayun",ci:0,cAns:[]}); }

function tabayun(){
 const C=CASES[S.ci]; const done=S.cAns.length;
 const qs=C.q.map((q,qi)=>{ if(qi>done) return ""; const ans=S.cAns[qi];
  return `<div class="card stack"><b class="small">Langkah ${qi+1} · ${q.ask}</b>${q.o.map((o,oi)=>{let cls="opt"; if(ans!==undefined){ if(oi===q.a) cls+=" good"; else if(oi===ans) cls+=" bad";}
   return `<button class="${cls}" ${ans!==undefined?"disabled":""} onclick="ansCase(${qi},${oi})">${o}</button>`;}).join("")}</div>`;}).join("");
 let act="";
 if(done>=3){const ans=S.cAns[3];
  act=`<div class="card stack"><b class="small">Keputusan: apa yang kamu lakukan?</b>${C.act.o.map((o,oi)=>{let cls="opt"; if(ans!==undefined){ if(oi===C.act.a) cls+=" good"; else if(oi===ans) cls+=" bad";}
   return `<button class="${cls}" ${ans!==undefined?"disabled":""} onclick="ansCase(3,${oi})">${o}</button>`;}).join("")}</div>`;
  if(ans!==undefined) act+=`<div class="reveal ${ans===C.act.a?"":"bad"} rise stack"><div class="dalil" style="margin:0">${C.dalil}</div><button class="btn" onclick="nextCase()">${S.ci<CASES.length-1?"Kabar berikutnya":"Lanjut ke Babak 3"}</button></div>`;}
 $(`${hud("Tabayun "+(S.ci+1)+"/"+CASES.length)}
 <div class="stack ${S.fx}">
  <h2>Teliti dulu, baru bersikap</h2>
  <div class="bubble"><div class="from">${C.from}</div>${C.msg}</div>
  ${qs}${act}
 </div>`);
}
function ansCase(qi,oi){
 const C=CASES[S.ci]; const ok=qi<3?C.q[qi].a===oi:C.act.a===oi;
 const a=[...S.cAns]; a[qi]=oi; S.cAns=a;
 if(ok){S.combo++; S.best=Math.max(S.best,S.combo); S.score+=qi<3?50:100;} else hurt(qi<3?6:12);
 render();
}
function nextCase(){ if(S.shield<=0) return set({screen:"over"}); if(S.ci<CASES.length-1) set({ci:S.ci+1,cAns:[]}); else set({screen:"boss",bi:0,bpick:null}); }

function boss(){
 const X=BOSS[S.bi]; const p=S.bpick;
 $(`${hud("Kolom komentar "+(S.bi+1)+"/"+BOSS.length)}
 <div class="stack ${S.fx}">
  <span class="tag red">${X.where}</span>
  <div class="card"><p>${X.sit}</p></div>
  <p class="small"><b>Balasan mana yang kamu kirim?</b></p>
  <div class="stack">${X.o.map((o,i)=>{let cls="opt"; if(p!==null){ if(o.good) cls+=" good"; else if(i===p) cls+=" bad";}
   return `<button class="${cls}" ${p!==null?"disabled":""} onclick="pickBoss(${i})">${o.t}</button>`;}).join("")}</div>
  ${p!==null?`<div class="reveal ${X.o[p].good?"":"bad"} rise stack"><p>${X.o[p].why}</p>${X.o[p].good?"":`<p class="small muted">Sikap terbaik: ${X.o.find(o=>o.good).why}</p>`}
   <button class="btn" onclick="nextBoss()">${S.bi<BOSS.length-1?"Situasi berikutnya":"Lihat hasil patroli"}</button></div>`:""}
 </div>`);
}
function pickBoss(i){ const ok=BOSS[S.bi].o[i].good; S.bpick=i; if(ok){S.combo++;S.best=Math.max(S.best,S.combo);S.score+=150;} else hurt(15); render(); }
function nextBoss(){ if(S.shield<=0) return set({screen:"over"}); if(S.bi<BOSS.length-1) set({bi:S.bi+1,bpick:null}); else set({screen:"result"}); }

function over(){
 $(`<div class="stack rise" style="padding-top:24px">
  <span class="tag red">Perisai runtuh</span>
  <h1>Kamu terseret arus</h1>
  <p class="muted">Tidak apa-apa. Justru begitulah cara vaksin bekerja: kamu baru saja merasakan sendiri betapa halusnya trik-trik ini. Coba lagi, dan kali ini perhatikan polanya.</p>
  <div class="card"><small class="muted">Poin terakhir</small><div class="big">${S.score}</div></div>
  <button class="btn" onclick="set(fresh())">Coba lagi</button>
 </div>`);
}
function result(){
 const total=Object.values(S.stats).reduce((a,b)=>a+b.n,0), right=Object.values(S.stats).reduce((a,b)=>a+b.ok,0);
 const rank=S.score>=2600?"Murabbi Linimasa":S.score>=1800?"Penjaga Tangguh":"Penjaga Pemula";
 let weak=null,wr=2; for(const k of ["S","E","B","A","R"]){const s=S.stats[k]; if(s&&s.n){const r=s.ok/s.n; if(r<wr){wr=r;weak=k;}}}
 const rows=["S","E","B","A","R","OK"].map(k=>{const s=S.stats[k]||{n:0,ok:0}; const pct=s.n?Math.round(s.ok/s.n*100):0;
  return `<div><div class="lbl small" style="display:flex;justify-content:space-between"><span>${TECH[k]}</span><span>${s.ok}/${s.n}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;}).join("");
 $(`<div class="stack rise" style="padding-top:16px">
  <span class="tag gold">Hasil patroli</span>
  <h1>${rank}</h1>
  <div class="grid2">
   <div class="card"><small class="muted">Total poin</small><div class="big">${S.score}</div></div>
   <div class="card"><small class="muted">Perisai tersisa</small><div class="big">${S.shield}%</div></div>
   <div class="card"><small class="muted">Unggahan tepat</small><div class="big" style="font-size:32px">${right}/${total}</div></div>
   <div class="card"><small class="muted">Kombo terbaik</small><div class="big" style="font-size:32px">x${S.best}</div></div>
  </div>
  <div class="card stack"><h3>Peta kekebalanmu</h3>${rows}
   ${weak&&wr<1?`<p class="small"><b>Titik rawanmu: ${TECH[weak]}.</b> ${DALIL[weak]}</p>`:`<p class="small"><b>Kebal terhadap semua trik.</b> Pertahankan dengan dosis penguat secara berkala.</p>`}</div>
  <div class="card stack small"><h3>Bekal yang kamu bawa pulang</h3>
   <span><b>Kenali trik:</b> Simbol, Eufemisme, Baper, Arus mayoritas, Rangkap palsu.</span>
   <span><b>Tabayun 3 langkah:</b> siapa sumbernya, apa buktinya, apa dampaknya jika disebar.</span>
   <span><b>Pegangan sikap:</b> “Aku membenci perbuatanmu” (QS asy-Syuʿarā’: 168). Tolak perbuatannya, jaga martabat manusianya.</span></div>
  <button class="btn" onclick="set(fresh())">Main lagi</button>
  <p class="footer">Efek inokulasi bisa memudar seiring waktu. Ulangi permainan ini secara berkala sebagai dosis penguat.</p>
 </div>`);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
